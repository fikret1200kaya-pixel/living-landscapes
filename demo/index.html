<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Landscapes — live demo</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0f1420;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#scenes,#modes{display:none}
.mark{position:fixed;right:14px;bottom:12px;z-index:40;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(10,14,26,.45);color:#fff;font-size:13px;font-weight:600;text-decoration:none;pointer-events:auto}
.mark img{width:24px;height:24px;border-radius:6px}
.solo{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(8,12,22,.55)}
.solo div{max-width:460px;margin:16px;padding:28px;border-radius:18px;background:#171e2e;color:#eef1f7;text-align:center;line-height:1.5}
.solo img{width:72px;height:72px;border-radius:16px}
.solo a{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:999px;background:#f6be8c;color:#34221a;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scenes"></div><div id="modes"></div>
<a class="mark" href="../" target="_top"><img src="../img/icon.png" alt="">Living Landscapes · demo</a>
<div class="solo" id="solo"><div><img src="../img/icon.png" alt=""><h2 style="margin:10px 0 6px">Living Landscapes — demo</h2>
<p>This is the website preview of one scene. The full app — five interactive landscapes, day &amp; night, running behind your desktop icons — is coming to Microsoft Store.</p>
<a href="../" target="_top">Learn more</a></div></div>
<script>

if (window.top === window.self) document.getElementById('solo').style.display = 'flex';
</script>
<script src="demo.js?v=60"></script>
</body>
</html>
